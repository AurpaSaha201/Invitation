<!DOCTYPE html>
<html lang="bn">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আমাদের বিবাহের নিমন্ত্রণ</title>

  <!-- Bengali Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================
       RESET
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: #f7efd9;
      font-family: "Noto Serif Bengali", serif;
      overflow-x: hidden;
      overflow-y: auto;
    }


    /* =========================
       FIRST PAGE
    ========================== */

    .wedding-section {
      position: relative;
      width: 100%;
      max-width: 620px;
      min-height: 100vh;
      margin: 0 auto;

      background-image: url("14.jpg");
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;

      overflow: hidden;
    }


    .first-page {
      min-height: 100vh;
    }


    /* =========================
       SCROLL
    ========================== */

    .scroll-wrapper {
      position: absolute;

      width: min(88%, 520px);

      top: 48%;
      right: 2%;

      transform: translateY(-50%);
    }

    .scroll-image {
      display: block;

      width: 100%;
      height: auto;

      object-fit: contain;
    }


    /* =========================
       TEXT ON SCROLL
    ========================== */

    .scroll-content {
      position: absolute;

      top: 50%;
      left: 50%;

      width: 70%;

      transform: translate(-50%, -50%);

      text-align: center;

      pointer-events: none;
    }

    .scroll-content h1 {
      color: #8d201b;

      font-size: clamp(28px, 5vw, 48px);

      font-weight: 700;

      white-space: nowrap;
    }


    /* =========================
       DECORATIVE LINE
    ========================== */

    .decor-line {
      display: flex;

      justify-content: center;
      align-items: center;

      gap: 6px;

      margin-top: 8px;
    }

    .decor-line span {
      width: 55px;
      height: 1px;

      background: #9b362d;
    }

    .decor-line i {
      width: 8px;
      height: 8px;

      background: #9b362d;

      transform: rotate(45deg);

      display: block;
    }


    /* =========================
       INTRO BUTTON
    ========================== */

  
.intro-button {
      position: absolute;
      top: calc(48% + 190px);
      right: 50%;
      transform: translateX(50%);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 260px;
      padding: 13px 25px;
      border: 2px solid #f4d65d;
      border-radius: 40px;
      background: #8d111d;
      color: white;
      font-family: "Noto Serif Bengali", serif;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden; /* শাইন ইফেক্টের জন্য জরুরি */
      z-index: 20;
      
      /* কন্টিনিউয়াস পাল্স অ্যানিমেশন (সবসময় চলতে থাকবে) */
      animation: pulseGlowDeep 1.8s infinite;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* বাটনের ভেতরে চকচকে গ্লো/শাইন এফেক্ট */
    .intro-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: 0.5s;
    }

    .intro-button:hover::before {
      left: 100%;
    }

    .intro-button strong {
      font-size: 22px;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    /* হোভার করলে বাটন বড় হবে এবং ডিপ শ্যাডো দেখাবে */
    .intro-button:hover {
      transform: translateX(50%) scale(1.03);
      box-shadow: 0 10px 30px rgba(100, 5, 13, 0.8);
    }

    .intro-button:hover strong {
      transform: translateX(6px);
    }

    /* আরও ডিপ এবং আকর্ষণীয় পাল্স কী-ফ্রেম অ্যানিমেশন */
    @keyframes pulseGlowDeep {
      0% {
        box-shadow: 0 0 0 0 rgba(244, 214, 93, 0.9), 0 0 15px rgba(141, 17, 29, 0.8);
      }
      70% {
        box-shadow: 0 0 0 16px rgba(244, 214, 93, 0), 0 0 25px rgba(141, 17, 29, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(244, 214, 93, 0), 0 0 15px rgba(141, 17, 29, 0);
      }
    }

    /* =========================
       SECOND PAGE
    ========================== */

    .wedding-page {
      position: relative;

      width: 100%;
      max-width: 600px;

      min-height: 100vh;

      margin: 0 auto;

      overflow: hidden;

      background: #4a0000;
    }


    /* =========================
       BACKGROUND
    ========================== */

    .background {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      z-index: 1;

      pointer-events: none;
    }


    /* =========================
       DARK OVERLAY
    ========================== */

    .wedding-page::after {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          to bottom,
          rgba(50, 0, 0, 0.03),
          rgba(70, 0, 0, 0.12)
        );

      z-index: 2;

      pointer-events: none;
    }


    /* =========================
       TOP CURTAIN
    ========================== */

    .top-curtain {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      z-index: 5;

      pointer-events: none;
    }

    .curtain {
      width: 100%;
      height: auto;

      display: block;
    }


    /* =========================
       COUNTDOWN
    ========================== */

    .countdown-section {
      position: absolute;

      top: 17%;
      left: 50%;

      transform: translateX(-50%);

      width: 88%;

      z-index: 10;

      text-align: center;
    }


    /* DATE */

    .date-box {
      width: 65%;

      margin: auto;

      padding: 8px 20px;

      border-top: 2px solid #d5a62a;
      border-bottom: 2px solid #d5a62a;

      color: #fff1c7;

      font-size: 22px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 12px;

      background: rgba(65, 0, 0, 0.70);

      box-shadow:
        0 0 10px rgba(0, 0, 0, 0.25);
    }

    .calendar-icon {
      font-size: 20px;
      color: #e8bd46;
    }


    /* COUNTDOWN BOXES */

    .countdown {
      margin-top: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 8px;

      border-top: 1px solid #bd8c1d;
      border-bottom: 1px solid #bd8c1d;
    }

    .time-box {
      width: 120px;
      height: 90px;

      border: 2px solid #c99a25;

      border-radius: 16px;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: rgba(55, 0, 0, 0.65);

      box-shadow:
        inset 0 0 15px rgba(200, 150, 30, 0.08);
    }

    .number {
      font-family: Georgia, serif;

      font-size: 38px;
      font-weight: 700;

      line-height: 1;

      color: #fff3cf;
    }

    .label {
      margin-top: 6px;

      font-family: Georgia, serif;

      font-size: 17px;

      color: #fff1d0;
    }

    .divider {
      color: #d9a82c;

      font-size: 18px;
    }


    /* =========================
       INVITATION BUTTON
    ========================== */

.invitation-button {
      position: absolute;
      top: 40%;
      right: 5%;
      z-index: 12;
      width: 280px;
      padding: 11px 18px;
      border: 2px solid #d6a72b;
      border-radius: 45px;
      background: rgba(55, 0, 0, 0.72);
      color: #fff0c8;
      text-decoration: none;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden; 
      
      /* আগের ডিপ পাল্স অ্যানিমেশন */
      animation: invitePulseDeep 1.8s infinite;
      transition: all 0.3s ease;
    }

    /* বাটনের ভেতরের লেখার জন্য জুম-ইন এবং জুম-আউট অ্যানিমেশন */
    .invitation-button span:not(.arrow) {
      display: inline-block;
      animation: textZoomPulse 1.5s ease-in-out infinite;
    }

    /* শাইন ইফেক্ট */
    .invitation-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(120deg, transparent, rgba(214, 167, 43, 0.3), transparent);
      transition: 0.5s;
    }

    .invitation-button:hover::before {
      left: 100%;
    }

    .invitation-button:hover {
      background: #700808;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(214, 167, 43, 0.5);
    }

    .envelope-icon {
      font-size: 23px;
    }

    .arrow {
      font-size: 28px;
      line-height: 1;
      display: inline-block;
      transition: transform 0.3s ease;
    }

    .invitation-button:hover .arrow {
      transform: translateX(6px);
    }

    /* বাটনের ডিপ পাল্স কী-ফ্রেম */
    @keyframes invitePulseDeep {
      0% {
        box-shadow: 0 0 0 0 rgba(214, 167, 43, 0.8), inset 0 0 10px rgba(112, 8, 8, 0.5);
      }
      70% {
        box-shadow: 0 0 0 15px rgba(214, 167, 43, 0), inset 0 0 20px rgba(214, 167, 43, 0.3);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(214, 167, 43, 0), inset 0 0 10px rgba(112, 8, 8, 0.5);
      }
    }

    /* লেখার জুম-ইন ও জুম-আউট অ্যানিমেশন কী-ফ্রেম */
    @keyframes textZoomPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08); /* লেখাটি ৮% বড় হয়ে আবার স্বাভাবিক হবে */
      }
    }
    /* =========================
       LOCATION CARD
    ========================== */

    .location-card {
      position: absolute;

      top: 40%;
      left: 5%;

      width: 320px;

      padding: 10px;

      border: 1px solid #d7aa43;
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.92);

      z-index: 10;

      box-shadow:
        0 12px 30px rgba(0, 0, 0, 0.35);
    }


    .location-title {
      display: flex;

      align-items: center;

      gap: 12px;

      padding: 5px;

      width: 100%;
    }

    .location-icon {
      width: 45px;
      height: 45px;

      min-width: 45px;

      border-radius: 50%;

      background: #6d0710;

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;
    }

    .location-title small {
      display: block;

      color: #70201d;

      font-family: Georgia, serif;

      font-size: 14px;
    }

    .location-title h2 {
      color: #6a1715;

      font-family: Georgia, serif;

      font-size: 22px;

      margin-top: 2px;
    }


    /* =========================
       GOOGLE MAP
    ========================== */

    .map-container {
      width: 100%;

      height: 220px;

      overflow: hidden;

      border-radius: 10px;

      margin-top: 4px;
    }

    .map-container iframe {
      width: 100%;
      height: 100%;

      display: block;

      border: 0;
    }


    /* =========================
       BOTTOM FLOWERS
    ========================== */

    .bottom-decoration {
      position: absolute;

      bottom: 0;
      left: 0;

      width: 100%;
      height: 150px;

      z-index: 7;

      pointer-events: none;
    }

    .flower {
      position: absolute;

      bottom: 20px;

      font-size: 60px;

      color: #d9a72c;

      text-shadow:
        0 0 10px rgba(255, 200, 60, 0.5);
    }

    .flower-left {
      left: 4%;
    }

    .flower-right {
      right: 4%;
    }

      /* SECOND PAGE */

      }

      .countdown {

      }

      }

<body>


  <!-- =====================================================
       FIRST PAGE
       INDEX 3 DESIGN
  ====================================================== -->

  <section class="wedding-section first-page" id="first-page">

  <!-- =========================
       COUNTDOWN JAVASCRIPT
  ========================== -->

  <script>

    const weddingDate =
      new Date("December 16, 2026 00:00:00").getTime();


    function updateCountdown() {

      const now =
        new Date().getTime();

      const distance =
        weddingDate - now;


      if (distance <= 0) {

        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";

        return;
      }


      const days =
        Math.floor(
          distance /
          (1000 * 60 * 60 * 24)
        );


      const hours =
        Math.floor(
          (distance %
            (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );


      const minutes =
        Math.floor(
          (distance %
            (1000 * 60 * 60)) /
          (1000 * 60)
        );


      const seconds =
        Math.floor(
          (distance %
            (1000 * 60)) /
          1000
        );


      document.getElementById("days").innerText =
        String(days).padStart(2, "0");

      document.getElementById("hours").innerText =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").innerText =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").innerText =
        String(seconds).padStart(2, "0");

    }


    updateCountdown();

    setInterval(updateCountdown, 1000);

  </script>
