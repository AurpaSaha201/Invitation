<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>শুভ বিবাহ</title>

    <!-- Bengali Font -->
    <link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #f8eed8;
            font-family: "Noto Serif Bengali", serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* =========================
            MAIN CARD (Background / Back)
        ========================= */
        .invitation-card {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 520px; /* ব্যাকগ্রাউন্ড সাইজ বড় করা হয়েছে */
            max-height: 100vh;
            background-image: url("fontpage.jpg");
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover; /* ব্যাকগ্রাউন্ড ফুল স্ক্রিন জুড়ে থাকবে */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .invitation-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 32%; 
        }

        /* =========================
            ALPONA (Alpona size boro kora hoyeche)
        ========================= */
        .alpona {
            position: absolute;
            top: 61%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 82%; /* আল্পনার সাইজ বড় করা হয়েছে */
            max-width: 400px;
            z-index: 5;
            pointer-events: none;
            animation: rotateAlpona 18s linear infinite;
        }

        .alpona img {
            display: block;
            width: 100%;
            height: auto;
        }

        @keyframes rotateAlpona {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        /* =========================
            ENVELOPE AREA (Envelope size choto kora hoyeche)
        ========================= */
        .envelope-link {
            position: relative;
            z-index: 10;
            display: block;
            width: 38%; /* এনভেলাপের সাইজ ছোট করা হয়েছে */
            max-width: 175px;
            margin-top: 14%;
            text-decoration: none;
            cursor: pointer;
            animation: envelopeBounce 1.6s ease-in-out infinite, envelopeGlow 1.6s ease-in-out infinite;
            transition: transform 0.25s ease;
        }

        .envelope-link:hover {
            transform: scale(1.08);
            animation-play-state: paused;
        }

        .envelope-link:active {
            transform: scale(0.95);
        }

        .envelope {
            position: relative;
            width: 100%;
            height: auto;
            display: block;
            z-index: 10;
        }

        /* =========================
            TEXT ON ENVELOPE
        ========================= */
        .envelope-text {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20;
            width: 80%;
            text-align: center;
            pointer-events: none;
        }

        .envelope-text p {
            margin: 1px 0;
            color: #5a1010;
            font-family: "Noto Serif Bengali", serif;
            font-size: clamp(10px, 2.6vw, 14px); /* ছোট খামের সাথে মানানসই ফন্ট সাইজ */
            font-weight: 700;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
            display: inline-block;
            animation: textBounce 1.6s ease-in-out infinite;
        }

        /* =========================
            ANIMATIONS
        ========================= */
        @keyframes envelopeBounce {
            0%, 100% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-8px) scale(1.03);
            }
        }

        @keyframes envelopeGlow {
            0%, 100% {
                filter: drop-shadow(0 0 4px rgba(245, 200, 80, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 18px rgba(255, 215, 0, 0.9));
            }
        }

        @keyframes textBounce {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        /* =========================
            RESPONSIVE MEDIA QUERIES FOR PHONES
        ========================= */
        @media (max-width: 480px) {
            .invitation-card {
                max-width: 100vw;
                height: 100vh;
            }
            .alpona {
                width: 85%; /* ছোট ফোনে আল্পনা আরও প্রমিনেন্ট ও বড় দেখাবে */
            }
            .envelope-link {
                width: 40%; /* ফোনে খামটি ছোট থাকবে */
                max-width: 160px;
                margin-top: 15%;
            }
        }
    </style>
</head>

<body>

    <div class="invitation-card">
        <div class="invitation-content">

            <!-- ROTATING ALPONA -->
            <div class="alpona">
                <img src="4.png" alt="Alpona">
            </div>

            <!-- CLICKABLE ENVELOPE -->
            <a href="index6.html" class="envelope-link" aria-label="Open Wedding Invitation">
                <img src="31.png" alt="Wedding Invitation Envelope" class="envelope">

                <!-- Text on envelope -->
                <div class="envelope-text">
                    <p>ভালোবাসা অঙ্গীকারে</p>
                    <p>আপনার নিমন্ত্রণ</p>
                </div>
            </a>

        </div>
    </div>

</body>
</html>
